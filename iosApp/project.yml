# Generate the Xcode project once Xcode is installed:
#   brew install xcodegen && cd iosApp && xcodegen
name: iosApp
options:
  preGenCommand: "awk '/^APP_VERSION_(NAME|CODE)=/ { print }' ../gradle.properties > Version.xcconfig"
  bundleIdPrefix: com.ziaee
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ziaee.zabankhan
        PRODUCT_NAME: Zabankhan
        MARKETING_VERSION: "$(APP_VERSION_NAME)"
        CURRENT_PROJECT_VERSION: "$(APP_VERSION_CODE)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "ComposeApp"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 7QZT8T38S4
        CODE_SIGN_STYLE: Automatic
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
