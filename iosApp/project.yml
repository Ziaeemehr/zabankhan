# Generate the Xcode project once Xcode is installed:
#   brew install xcodegen && cd iosApp && xcodegen
name: iosApp
options:
  preGenCommand: "awk '/^APP_VERSION_(NAME|CODE)=/ { print }' ../gradle.properties > Version.xcconfig"
  bundleIdPrefix: com.ziaee
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ziaee.zabankhan
        ZABANKHAN_GOOGLE_CLIENT_ID: "229288799193-iebs9psmag7fqe3chmo8uul8j1ofru7a.apps.googleusercontent.com"
        ZABANKHAN_GOOGLE_REDIRECT_SCHEME: "com.googleusercontent.apps.229288799193-iebs9psmag7fqe3chmo8uul8j1ofru7a"
        PRODUCT_NAME: Zabankhan
        MARKETING_VERSION: "$(APP_VERSION_NAME)"
        CURRENT_PROJECT_VERSION: "$(APP_VERSION_CODE)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "ComposeApp"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 7QZT8T38S4
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: ShareExtension
        embed: true
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ziaee.zabankhan
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ziaee.zabankhan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ziaee.zabankhan.share
        PRODUCT_NAME: ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        MARKETING_VERSION: "$(APP_VERSION_NAME)"
        CURRENT_PROJECT_VERSION: "$(APP_VERSION_CODE)"
        DEVELOPMENT_TEAM: 7QZT8T38S4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
