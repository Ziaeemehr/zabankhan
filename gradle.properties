# Kotlin/Native release optimization exceeds a 4 GiB heap.
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
# Incremental Android compilation drops generated Room classes from the APK.
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx3072m
# Kotlin 2.2.x otherwise pauses application threads for GC marking.
kotlin.native.binary.gc=cms
android.useAndroidX=true
android.nonTransitiveRClass=true
APP_VERSION_NAME=1.1.0
APP_VERSION_CODE=4
