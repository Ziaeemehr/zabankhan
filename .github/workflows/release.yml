name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create a draft release for review
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          code=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$code" =~ ^[1-9][0-9]*$ ]] && (( code <= 2100000000 ))
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag must match APP_VERSION_NAME: $tag"
            exit 1
          fi
          # An API failure must not be mistaken for an absent release.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$tag" "$RUNNER_TEMP/release-tags"; then
            echo "::error::Release $tag already exists. Increase the version before releasing again."
            exit 1
          fi
          # A manual run must never attach binaries to a tag for another commit.
          if git ls-remote --exit-code origin "refs/tags/$tag" > "$RUNNER_TEMP/release-ref"; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing tag $tag points to a different commit."
              exit 1
            fi
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path

          names = (
              "ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD",
          )
          for name in names:
              if not os.environ.get(name):
                  raise SystemExit(f"::error::Missing repository secret: {name}")

          def escape(value):
              # Java Properties accepts UTF-16 escapes, including special characters.
              encoded = value.encode("utf-16-be")
              return "".join(f"\\u{int.from_bytes(encoded[i:i+2], 'big'):04x}" for i in range(0, len(encoded), 2))

          os.umask(0o077)
          directory = Path(os.environ["RUNNER_TEMP"]) / "release-signing"
          directory.mkdir(exist_ok=True)
          keystore = directory / "release.jks"
          keystore.write_bytes(base64.b64decode("".join(os.environ[names[0]].split()), validate=True))
          values = {
              "storeFile": str(keystore),
              "storePassword": os.environ[names[1]],
              "keyAlias": os.environ[names[2]],
              "keyPassword": os.environ[names[3]],
          }
          (directory / "release.properties").write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in values.items()), encoding="ascii"
          )

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed Android artifacts
        run: >-
          ./gradlew :composeApp:assemblePlayRelease
          :composeApp:bundlePlayRelease
          -PzabankhanSigningProps="$RUNNER_TEMP/release-signing/release.properties"
          --console=plain

      - name: Collect release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp composeApp/build/outputs/apk/play/release/composeApp-play-release.apk \
            "release-assets/zabankhan-$VERSION-play.apk"
          cp composeApp/build/outputs/mapping/playRelease/mapping.txt \
            "release-assets/zabankhan-$VERSION-play-mapping.txt"
          cp composeApp/build/outputs/bundle/playRelease/composeApp-play-release.aab \
            "release-assets/zabankhan-$VERSION-play.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/*
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/release-signing"

  publish:
    needs: [prepare, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum ./* > SHA256SUMS)
          args=(--repo "$GH_REPO" --target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [[ "$DRAFT" == true ]]; then args+=(--draft); fi
          gh release create "$TAG" "${args[@]}" release-assets/*
